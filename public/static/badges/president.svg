<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="200" height="200">
  <defs>
    <radialGradient id="bg" cx="50%" cy="40%" r="60%">
      <stop offset="0%" stop-color="#C8A040"/>
      <stop offset="100%" stop-color="#1A0800"/>
    </radialGradient>
    <radialGradient id="shine" cx="35%" cy="25%" r="55%">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.32"/>
      <stop offset="100%" stop-color="#FFFFFF" stop-opacity="0"/>
    </radialGradient>
    <filter id="glow"><feGaussianBlur stdDeviation="5" result="blur"/><feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
    <filter id="shadow"><feDropShadow dx="0" dy="7" stdDeviation="10" flood-color="#000" flood-opacity="0.7"/></filter>
    <linearGradient id="rim" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFF0A0"/>
      <stop offset="45%" stop-color="#907010"/>
      <stop offset="100%" stop-color="#FFF0A0"/>
    </linearGradient>
    <linearGradient id="gold" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FFF4B0"/>
      <stop offset="40%" stop-color="#E8C030"/>
      <stop offset="100%" stop-color="#8B5A00"/>
    </linearGradient>
  </defs>
  <circle cx="100" cy="100" r="96" fill="url(#rim)" filter="url(#shadow)"/>
  <circle cx="100" cy="100" r="88" fill="url(#bg)"/>
  <circle cx="100" cy="100" r="88" fill="url(#shine)"/>
  <!-- Outer ring decoration -->
  <circle cx="100" cy="100" r="74" fill="none" stroke="#FFD840" stroke-width="1.5" stroke-dasharray="8,4" opacity="0.6"/>
  <!-- 8-point star -->
  <polygon points="100,30 106,58 130,44 116,68 144,68 122,86 138,108 112,100 112,130 100,108 88,130 88,100 62,108 78,86 56,68 84,68 70,44 94,58" fill="url(#gold)" filter="url(#glow)"/>
  <!-- Crown imperial 5pts -->
  <path d="M58 44 L68 22 L100 38 L132 22 L142 44 Z" fill="url(#gold)" filter="url(#glow)"/>
  <path d="M58 44 L142 44 L137 56 L63 56 Z" fill="#A07808"/>
  <circle cx="68" cy="22" r="6" fill="#FFF0A0" stroke="#D0A010" stroke-width="1.5"/>
  <circle cx="100" cy="38" r="6" fill="#FFF0A0" stroke="#D0A010" stroke-width="1.5"/>
  <circle cx="132" cy="22" r="6" fill="#FFF0A0" stroke="#D0A010" stroke-width="1.5"/>
  <circle cx="58" cy="44" r="4.5" fill="#FFD860"/>
  <circle cx="142" cy="44" r="4.5" fill="#FFD860"/>
  <text x="100" y="165" text-anchor="middle" font-family="Georgia,serif" font-size="11" fill="#FFD860" letter-spacing="3">PRESIDENT</text>
  <line x1="38" y1="160" x2="58" y2="160" stroke="#D0A010" stroke-width="1.5" opacity="0.9"/>
  <line x1="142" y1="160" x2="162" y2="160" stroke="#D0A010" stroke-width="1.5" opacity="0.9"/>
</svg>
