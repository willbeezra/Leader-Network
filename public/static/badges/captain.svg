<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="200" height="200">
  <defs>
    <radialGradient id="bg" cx="50%" cy="40%" r="60%">
      <stop offset="0%" stop-color="#7EB8D4"/>
      <stop offset="100%" stop-color="#0A2040"/>
    </radialGradient>
    <radialGradient id="shine" cx="35%" cy="25%" r="55%">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.30"/>
      <stop offset="100%" stop-color="#FFFFFF" stop-opacity="0"/>
    </radialGradient>
    <filter id="glow"><feGaussianBlur stdDeviation="3" result="blur"/><feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
    <filter id="shadow"><feDropShadow dx="0" dy="5" stdDeviation="7" flood-color="#000" flood-opacity="0.55"/></filter>
    <linearGradient id="rim" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#D4EEFF"/>
      <stop offset="40%" stop-color="#2A7AAA"/>
      <stop offset="100%" stop-color="#D4EEFF"/>
    </linearGradient>
    <linearGradient id="crown" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FFE88A"/>
      <stop offset="100%" stop-color="#C89820"/>
    </linearGradient>
  </defs>
  <circle cx="100" cy="100" r="96" fill="url(#rim)" filter="url(#shadow)"/>
  <circle cx="100" cy="100" r="88" fill="url(#bg)"/>
  <circle cx="100" cy="100" r="88" fill="url(#shine)"/>
  <!-- Anchor icon -->
  <circle cx="100" cy="92" r="28" fill="none" stroke="#3A9ACC" stroke-width="2.5" opacity="0.5"/>
  <line x1="100" y1="64" x2="100" y2="120" stroke="#5AB4DC" stroke-width="3.5" stroke-linecap="round"/>
  <line x1="76" y1="120" x2="124" y2="120" stroke="#5AB4DC" stroke-width="3.5" stroke-linecap="round"/>
  <path d="M76 120 Q68 108 72 98" stroke="#5AB4DC" stroke-width="3" fill="none" stroke-linecap="round"/>
  <path d="M124 120 Q132 108 128 98" stroke="#5AB4DC" stroke-width="3" fill="none" stroke-linecap="round"/>
  <circle cx="100" cy="68" r="7" fill="#5AB4DC" stroke="#A0D8F0" stroke-width="1.5"/>
  <!-- Crown -->
  <path d="M72 58 L80 42 L100 54 L120 42 L128 58 Z" fill="url(#crown)" filter="url(#glow)"/>
  <circle cx="80" cy="42" r="4" fill="#FFE88A"/>
  <circle cx="100" cy="54" r="4" fill="#FFE88A"/>
  <circle cx="120" cy="42" r="4" fill="#FFE88A"/>
  <text x="100" y="162" text-anchor="middle" font-family="Georgia,serif" font-size="11" fill="#7ACAEC" letter-spacing="3">CAPTAIN</text>
  <circle cx="57" cy="155" r="3" fill="#FFD84A" opacity="0.9"/>
  <circle cx="143" cy="155" r="3" fill="#FFD84A" opacity="0.9"/>
