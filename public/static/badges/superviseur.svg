<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="200" height="200">
  <defs>
    <radialGradient id="bg" cx="50%" cy="40%" r="60%">
      <stop offset="0%" stop-color="#D44A4A"/>
      <stop offset="100%" stop-color="#280000"/>
    </radialGradient>
    <radialGradient id="shine" cx="35%" cy="25%" r="55%">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.28"/>
      <stop offset="100%" stop-color="#FFFFFF" stop-opacity="0"/>
    </radialGradient>
    <filter id="glow"><feGaussianBlur stdDeviation="5" result="blur"/><feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
    <filter id="shadow"><feDropShadow dx="0" dy="6" stdDeviation="9" flood-color="#000" flood-opacity="0.65"/></filter>
    <linearGradient id="rim" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFD0C0"/>
      <stop offset="45%" stop-color="#A02020"/>
      <stop offset="100%" stop-color="#FFD0C0"/>
    </linearGradient>
    <linearGradient id="gold" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FFE896"/>
      <stop offset="50%" stop-color="#D4A520"/>
      <stop offset="100%" stop-color="#8B5A00"/>
    </linearGradient>
  </defs>
  <circle cx="100" cy="100" r="96" fill="url(#rim)" filter="url(#shadow)"/>
  <circle cx="100" cy="100" r="88" fill="url(#bg)"/>
  <circle cx="100" cy="100" r="88" fill="url(#shine)"/>
  <!-- Double star -->
  <polygon points="100,35 109,68 144,68 117,89 127,122 100,102 73,122 83,89 56,68 91,68" fill="url(#gold)" filter="url(#glow)" opacity="0.7"/>
  <polygon points="100,50 107,72 130,72 112,86 119,108 100,95 81,108 88,86 70,72 93,72" fill="url(#gold)" filter="url(#glow)"/>
  <!-- Crown imperial -->
  <path d="M65 50 L75 30 L100 45 L125 30 L135 50 Z" fill="url(#gold)" filter="url(#glow)"/>
  <path d="M65 50 L135 50 L130 60 L70 60 Z" fill="#C89010"/>
  <circle cx="75" cy="30" r="5.5" fill="#FFE896" stroke="#C8A020" stroke-width="1.5"/>
  <circle cx="100" cy="45" r="5.5" fill="#FFE896" stroke="#C8A020" stroke-width="1.5"/>
  <circle cx="125" cy="30" r="5.5" fill="#FFE896" stroke="#C8A020" stroke-width="1.5"/>
  <text x="100" y="165" text-anchor="middle" font-family="Georgia,serif" font-size="10" fill="#FFB090" letter-spacing="2">SUPERVISEUR</text>
  <line x1="40" y1="160" x2="58" y2="160" stroke="#D44040" stroke-width="1.5" opacity="0.7"/>
  <line x1="142" y1="160" x2="160" y2="160" stroke="#D44040" stroke-width="1.5" opacity="0.7"/>
</svg>
