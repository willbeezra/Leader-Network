<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="200" height="200">
  <defs>
    <radialGradient id="bg" cx="50%" cy="40%" r="60%">
      <stop offset="0%" stop-color="#AAAAFF"/>
      <stop offset="100%" stop-color="#000018"/>
    </radialGradient>
    <radialGradient id="shine" cx="35%" cy="25%" r="55%">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.38"/>
      <stop offset="100%" stop-color="#FFFFFF" stop-opacity="0"/>
    </radialGradient>
    <filter id="glow"><feGaussianBlur stdDeviation="6" result="blur"/><feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
    <filter id="glow2"><feGaussianBlur stdDeviation="3" result="blur"/><feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
    <filter id="shadow"><feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#0000AA" flood-opacity="0.6"/></filter>
    <linearGradient id="rim" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#E0E0FF"/>
      <stop offset="30%" stop-color="#8080FF"/>
      <stop offset="60%" stop-color="#2020C0"/>
      <stop offset="100%" stop-color="#E0E0FF"/>
    </linearGradient>
    <linearGradient id="cosmic" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="25%" stop-color="#C0C0FF"/>
      <stop offset="60%" stop-color="#6060E0"/>
      <stop offset="100%" stop-color="#1010A0"/>
    </linearGradient>
    <linearGradient id="gold" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="30%" stop-color="#FFE896"/>
      <stop offset="100%" stop-color="#906000"/>
    </linearGradient>
  </defs>
  <circle cx="100" cy="100" r="96" fill="url(#rim)" filter="url(#shadow)"/>
  <circle cx="100" cy="100" r="88" fill="url(#bg)"/>
  <circle cx="100" cy="100" r="88" fill="url(#shine)"/>
  <!-- Cosmic rings -->
  <ellipse cx="100" cy="100" rx="72" ry="22" fill="none" stroke="#6060FF" stroke-width="1.5" opacity="0.5" transform="rotate(-20,100,100)"/>
  <ellipse cx="100" cy="100" rx="72" ry="22" fill="none" stroke="#8080FF" stroke-width="1" opacity="0.35" transform="rotate(20,100,100)"/>
  <!-- 12-point cosmic star -->
  <polygon points="100,28 104,55 118,36 110,60 130,46 116,68 140,62 120,78 144,82 120,90 140,102 116,102 130,122 108,114 112,140 100,122 88,140 92,114 70,122 84,102 60,102 80,90 56,82 80,78 60,62 84,68 70,46 90,60 82,36 96,55" fill="url(#cosmic)" filter="url(#glow)" opacity="0.9"/>
  <!-- Small stars -->
  <circle cx="68" cy="50" r="3" fill="#FFFFFF" filter="url(#glow2)" opacity="0.8"/>
  <circle cx="132" cy="50" r="3" fill="#FFFFFF" filter="url(#glow2)" opacity="0.8"/>
  <circle cx="55" cy="90" r="2.5" fill="#C0C0FF" filter="url(#glow2)" opacity="0.7"/>
  <circle cx="145" cy="90" r="2.5" fill="#C0C0FF" filter="url(#glow2)" opacity="0.7"/>
  <!-- Crown transcendent -->
  <path d="M48 42 L60 12 L100 30 L140 12 L152 42 Z" fill="url(#gold)" filter="url(#glow)"/>
  <path d="M48 42 L152 42 L146 56 L54 56 Z" fill="#705000"/>
  <circle cx="60" cy="12" r="7.5" fill="#FFFFFF" stroke="#D0A010" stroke-width="2"/>
  <circle cx="100" cy="30" r="7.5" fill="#FFFFFF" stroke="#D0A010" stroke-width="2"/>
  <circle cx="140" cy="12" r="7.5" fill="#FFFFFF" stroke="#D0A010" stroke-width="2"/>
  <circle cx="48" cy="42" r="6" fill="#FFE896"/>
  <circle cx="152" cy="42" r="6" fill="#FFE896"/>
  <text x="100" y="166" text-anchor="middle" font-family="Georgia,serif" font-size="11" fill="#C0C0FF" letter-spacing="2">VISIONARY</text>
  <line x1="32" y1="161" x2="56" y2="161" stroke="#6060E0" stroke-width="2" opacity="0.9"/>
  <line x1="144" y1="161" x2="168" y2="161" stroke="#6060E0" stroke-width="2" opacity="0.9"/>
</svg>
