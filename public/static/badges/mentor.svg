<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="200" height="200">
  <defs>
    <radialGradient id="bg" cx="50%" cy="40%" r="60%">
      <stop offset="0%" stop-color="#9B72CF"/>
      <stop offset="100%" stop-color="#1A0030"/>
    </radialGradient>
    <radialGradient id="shine" cx="35%" cy="25%" r="55%">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.30"/>
      <stop offset="100%" stop-color="#FFFFFF" stop-opacity="0"/>
    </radialGradient>
    <filter id="glow"><feGaussianBlur stdDeviation="4" result="blur"/><feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
    <filter id="shadow"><feDropShadow dx="0" dy="5" stdDeviation="8" flood-color="#000" flood-opacity="0.6"/></filter>
    <linearGradient id="rim" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#DCC8FF"/>
      <stop offset="45%" stop-color="#6030A0"/>
      <stop offset="100%" stop-color="#DCC8FF"/>
    </linearGradient>
    <linearGradient id="gem" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#E8C8FF"/>
      <stop offset="50%" stop-color="#9050D0"/>
      <stop offset="100%" stop-color="#4010A0"/>
    </linearGradient>
  </defs>
  <circle cx="100" cy="100" r="96" fill="url(#rim)" filter="url(#shadow)"/>
  <circle cx="100" cy="100" r="88" fill="url(#bg)"/>
  <circle cx="100" cy="100" r="88" fill="url(#shine)"/>
  <!-- Gem shape -->
  <polygon points="100,40 140,65 140,115 100,145 60,115 60,65" fill="url(#gem)" filter="url(#glow)" stroke="#C090F0" stroke-width="1.5"/>
  <polygon points="100,40 140,65 100,95 60,65" fill="#C090F0" opacity="0.3"/>
  <polygon points="100,145 140,115 100,95 60,115" fill="#4010A0" opacity="0.4"/>
  <!-- Crown with 3 gems -->
  <path d="M70 65 L78 48 L100 60 L122 48 L130 65 Z" fill="#C090F0" filter="url(#glow)"/>
  <circle cx="78" cy="48" r="5" fill="#E8C8FF" stroke="#9050D0" stroke-width="1"/>
  <circle cx="100" cy="60" r="5" fill="#E8C8FF" stroke="#9050D0" stroke-width="1"/>
  <circle cx="122" cy="48" r="5" fill="#E8C8FF" stroke="#9050D0" stroke-width="1"/>
  <text x="100" y="95" text-anchor="middle" font-family="Georgia,serif" font-size="18" font-weight="bold" fill="#F0D8FF" opacity="0.9">✦</text>
  <text x="100" y="164" text-anchor="middle" font-family="Georgia,serif" font-size="11" fill="#C090F0" letter-spacing="4">MENTOR</text>
  <line x1="46" y1="159" x2="66" y2="159" stroke="#9050D0" stroke-width="1.5" opacity="0.8"/>
  <line x1="134" y1="159" x2="154" y2="159" stroke="#9050D0" stroke-width="1.5" opacity="0.8"/>
</svg>
