<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>LEADER — Administration</title>
  <!-- CSS critique inline : garantit rendu immédiat même si Tailwind tarde -->
  <style>
    body{background:#0A0A0F;color:#fff;font-family:system-ui,sans-serif;margin:0}
    #admin-auth-screen{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:1rem}
    #admin-app{display:none}
    #admin-app.visible{display:flex}
    input{background:#1A1A26;border:1px solid #22223A;color:#fff;padding:.75rem 1rem;border-radius:.75rem;width:100%;box-sizing:border-box;font-size:1rem}
    button{cursor:pointer}
    .btn-primary{background:linear-gradient(to right,#dc2626,#b91c1c);color:#fff;font-weight:700;padding:.75rem 1.5rem;border-radius:.75rem;border:none;width:100%;font-size:1rem;transition:opacity .2s}
    .btn-primary:hover{opacity:.85}
    .btn-primary:active{opacity:.7}
    #admin-login-error{display:none;color:#f87171;background:rgba(127,29,29,.2);border-radius:.5rem;padding:.75rem;font-size:.875rem;margin-top:.5rem}
    #admin-login-error.visible{display:block}
  </style>
  <style>
/* ============================================================
   LEADER — Styles globaux
   ============================================================ */

* { box-sizing: border-box; }

body {
  font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
  -webkit-font-smoothing: antialiased;
}

/* Scrollbar */
::-webkit-scrollbar { width: 6px; height: 6px; }
::-webkit-scrollbar-track { background: #12121A; }
::-webkit-scrollbar-thumb { background: #22223A; border-radius: 3px; }
::-webkit-scrollbar-thumb:hover { background: #F59E0B; }

/* Nav active */
.nav-btn.active, .admin-nav-btn.active {
  background: linear-gradient(135deg, rgba(245,158,11,0.15), rgba(245,158,11,0.05));
  color: #F59E0B !important;
  border-right: 2px solid #F59E0B;
}
.admin-nav-btn.active {
  background: linear-gradient(135deg, rgba(239,68,68,0.15), rgba(239,68,68,0.05));
  color: #EF4444 !important;
  border-right: 2px solid #EF4444;
}

/* Cards */
.stat-card {
  background: linear-gradient(135deg, #12121A, #1A1A26);
  border: 1px solid #22223A;
  border-radius: 16px;
  padding: 20px;
  transition: transform 0.2s, box-shadow 0.2s;
}
.stat-card:hover { transform: translateY(-2px); box-shadow: 0 8px 32px rgba(0,0,0,0.3); }

/* Rank badges */
.rank-none       { color: #6B7280; background: rgba(107,114,128,0.15); }
.rank-administrator { color: #60A5FA; background: rgba(96,165,250,0.15); }
.rank-manager    { color: #34D399; background: rgba(52,211,153,0.15); }
.rank-captain    { color: #FBBF24; background: rgba(251,191,36,0.15); }
.rank-leader     { color: #F97316; background: rgba(249,115,22,0.15); }
.rank-mentor     { color: #A78BFA; background: rgba(167,139,250,0.15); }
.rank-superviseur{ color: #EC4899; background: rgba(236,72,153,0.15); }
.rank-executive  { color: #06B6D4; background: rgba(6,182,212,0.15); }
.rank-president  { color: #EF4444; background: rgba(239,68,68,0.15); }
.rank-director   { color: #8B5CF6; background: rgba(139,92,246,0.15); }
.rank-boss       { color: #F59E0B; background: rgba(245,158,11,0.2); }
.rank-visionary  { 
  background: linear-gradient(135deg, rgba(245,158,11,0.3), rgba(239,68,68,0.2));
  color: #FCD34D;
}

/* Status badges */
.status-ami     { color: #FBBF24; background: rgba(251,191,36,0.15); }
.status-partner { color: #34D399; background: rgba(52,211,153,0.15); }
.status-client  { color: #60A5FA; background: rgba(96,165,250,0.15); }
.status-member  { color: #9CA3AF; background: rgba(156,163,175,0.15); }

/* Table */
.data-table { width: 100%; border-collapse: collapse; }
.data-table th {
  background: #1A1A26;
  color: #9CA3AF;
  font-size: 11px;
  text-transform: uppercase;
  letter-spacing: 0.05em;
  padding: 12px 16px;
  text-align: left;
  font-weight: 500;
  border-bottom: 1px solid #22223A;
}
.data-table td {
  padding: 14px 16px;
  border-bottom: 1px solid #1A1A26;
  font-size: 13px;
  color: #D1D5DB;
}
.data-table tr:hover td { background: rgba(245,158,11,0.04); }
.data-table tr:last-child td { border-bottom: none; }

/* Binary tree */
.tree-node {
  display: inline-flex;
  flex-direction: column;
  align-items: center;
  min-width: 120px;
}
.tree-node-card {
  border: 1px solid #22223A;
  border-radius: 12px;
  padding: 10px 14px;
  background: #1A1A26;
  text-align: center;
  cursor: pointer;
  transition: all 0.2s;
  min-width: 110px;
}
.tree-node-card:hover { border-color: #F59E0B; background: #22223A; }
.tree-node-card.empty {
  border-style: dashed;
  border-color: #374151;
  background: #12121A;
  opacity: 0.6;
}
.tree-connector {
  width: 2px;
  height: 24px;
  background: #22223A;
  margin: 0 auto;
}
.tree-children {
  display: flex;
  gap: 16px;
  position: relative;
}
.tree-children::before {
  content: '';
  position: absolute;
  top: 0;
  left: 50%;
  transform: translateX(-50%);
  width: calc(100% - 60px);
  height: 2px;
  background: #22223A;
}

/* Progress bar */
.progress-bar {
  background: #22223A;
  border-radius: 999px;
  height: 8px;
  overflow: hidden;
}
.progress-fill {
  height: 100%;
  border-radius: 999px;
  background: linear-gradient(90deg, #F59E0B, #EF4444);
  transition: width 0.6s ease;
}

/* Commission type badges */
.comm-prime_leadership        { color: #FBBF24; }
.comm-bonus_influence         { color: #60A5FA; }
.comm-bonus_rayonnement       { color: #34D399; }
.comm-valorisation_recommandation { color: #A78BFA; }
.comm-fast_start              { color: #F97316; }
.comm-credit_croissance       { color: #EC4899; }
.comm-reserve_strategique     { color: #06B6D4; }

/* Animations */
@keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }
.fade-in { animation: fadeIn 0.3s ease forwards; }

@keyframes pulse-gold { 0%, 100% { box-shadow: 0 0 0 0 rgba(245,158,11,0.4); } 50% { box-shadow: 0 0 0 8px rgba(245,158,11,0); } }
.pulse-gold { animation: pulse-gold 2s infinite; }

/* Input */
.form-input {
  width: 100%;
  background: #1A1A26;
  border: 1px solid #22223A;
  border-radius: 10px;
  padding: 10px 14px;
  color: #fff;
  font-size: 14px;
  outline: none;
  transition: border-color 0.2s;
}
.form-input:focus { border-color: #F59E0B; }
.form-label { display: block; font-size: 12px; color: #9CA3AF; margin-bottom: 6px; font-weight: 500; }

/* Modal */
#modal-overlay { backdrop-filter: blur(4px); }

/* Loader */
.loader {
  width: 36px; height: 36px;
  border: 3px solid #22223A;
  border-top-color: #F59E0B;
  border-radius: 50%;
  animation: spin 0.8s linear infinite;
}
@keyframes spin { to { transform: rotate(360deg); } }

/* Toast */
#toast.show { animation: slideUp 0.3s ease; }
@keyframes slideUp { from { opacity:0; transform: translateY(20px); } to { opacity:1; transform: translateY(0); } }

  </style>
</head>
<body class="bg-dark-900 text-white min-h-screen">

<!-- ADMIN AUTH -->
<div id="admin-auth-screen" style="display:flex" class="min-h-screen flex items-center justify-center bg-dark-900 p-4">
  <div class="w-full max-w-md">
    <div class="text-center mb-8">
      <div class="inline-flex items-center justify-center w-16 h-16 rounded-2xl bg-gradient-to-br from-red-500 to-red-700 mb-4 shadow-lg">
        <i class="fas fa-shield-halved text-white text-2xl"></i>
      </div>
      <h1 class="text-3xl font-bold text-white">Administration</h1>
      <p class="text-gray-400 mt-1">LEADER — Accès restreint</p>
    </div>
    <div class="bg-dark-800 rounded-2xl p-8 shadow-2xl border border-dark-600">
      <div class="space-y-4">
        <div>
          <label class="block text-sm text-gray-400 mb-1">Email administrateur</label>
          <input id="admin-email" type="email" placeholder="admin@leader-network.com"
            class="w-full bg-dark-700 border border-dark-600 rounded-xl px-4 py-3 text-white placeholder-gray-500 focus:border-red-500 focus:outline-none">
        </div>
        <div>
          <label class="block text-sm text-gray-400 mb-1">Mot de passe</label>
          <input id="admin-password" type="password" placeholder="••••••••"
            class="w-full bg-dark-700 border border-dark-600 rounded-xl px-4 py-3 text-white placeholder-gray-500 focus:border-red-500 focus:outline-none">
        </div>
        <div id="admin-login-error" style="display:none" class="text-red-400 text-sm bg-red-900/20 rounded-lg p-3"></div>
        <button id="admin-login-btn" onclick="doAdminLogin()" class="w-full bg-gradient-to-r from-red-600 to-red-700 text-white font-bold py-3 rounded-xl hover:from-red-500 hover:to-red-600 transition">
          Accéder au panneau admin
        </button>
      </div>
      <div class="mt-4 text-center">
        <a href="/" class="text-gray-500 text-xs hover:text-gray-300">← Espace membre</a>
      </div>
    </div>
  </div>
</div>

<!-- ADMIN APP -->
<div id="admin-app" class="flex h-screen overflow-hidden" style="display:none">
  <!-- SIDEBAR ADMIN -->
  <aside class="w-64 bg-dark-800 border-r border-dark-600 flex flex-col flex-shrink-0">
    <div class="p-6 border-b border-dark-600">
      <div class="flex items-center gap-3">
        <div class="w-10 h-10 rounded-xl bg-gradient-to-br from-red-500 to-red-700 flex items-center justify-center">
          <i class="fas fa-shield-halved text-white text-lg"></i>
        </div>
        <div>
          <div class="font-bold text-white">LEADER</div>
          <div class="text-xs text-red-400">Administration</div>
        </div>
      </div>
    </div>
    <nav class="flex-1 overflow-y-auto p-3 space-y-1">
      <button onclick="showAdminPage('dashboard')" class="admin-nav-btn w-full flex items-center gap-3 px-4 py-3 rounded-xl text-gray-300 hover:bg-dark-700 hover:text-white transition text-sm" data-page="dashboard">
        <i class="fas fa-chart-pie w-5 text-center"></i> Dashboard
      </button>
      <button onclick="showAdminPage('members')" class="admin-nav-btn w-full flex items-center gap-3 px-4 py-3 rounded-xl text-gray-300 hover:bg-dark-700 hover:text-white transition text-sm" data-page="members">
        <i class="fas fa-users w-5 text-center"></i> Membres
      </button>
      <button onclick="showAdminPage('binary-tree')" class="admin-nav-btn w-full flex items-center gap-3 px-4 py-3 rounded-xl text-gray-300 hover:bg-dark-700 hover:text-white transition text-sm" data-page="binary-tree">
        <i class="fas fa-sitemap w-5 text-center"></i> Arbre Binaire
      </button>
      <button onclick="showAdminPage('holding-tank')" class="admin-nav-btn w-full flex items-center gap-3 px-4 py-3 rounded-xl text-gray-300 hover:bg-dark-700 hover:text-white transition text-sm" data-page="holding-tank">
        <i class="fas fa-clock w-5 text-center"></i> Holding Tank
        <span id="admin-ht-badge" class="hidden ml-auto bg-orange-500 text-white text-xs rounded-full px-2 py-0.5">0</span>
      </button>
      <button onclick="showAdminPage('activations')" class="admin-nav-btn w-full flex items-center gap-3 px-4 py-3 rounded-xl text-gray-300 hover:bg-dark-700 hover:text-white transition text-sm" data-page="activations">
        <i class="fas fa-check-circle w-5 text-center"></i> Activations

      </button>
      <button onclick="showAdminPage('withdrawals')" class="admin-nav-btn w-full flex items-center gap-3 px-4 py-3 rounded-xl text-gray-300 hover:bg-dark-700 hover:text-white transition text-sm" data-page="withdrawals">
        <i class="fas fa-money-bill-transfer w-5 text-center"></i> Retraits
        <span id="admin-wd-badge" class="hidden ml-auto bg-blue-500 text-white text-xs rounded-full px-2 py-0.5">0</span>
      </button>
      <button onclick="showAdminPage('cc-withdrawals')" class="admin-nav-btn w-full flex items-center gap-3 px-4 py-3 rounded-xl text-gray-300 hover:bg-dark-700 hover:text-white transition text-sm" data-page="cc-withdrawals">
        <i class="fas fa-seedling w-5 text-center text-orange-400"></i> Crédit Croissance
        <span id="admin-cc-badge" class="hidden ml-auto bg-orange-500 text-white text-xs rounded-full px-2 py-0.5">0</span>
      </button>
      <button onclick="showAdminPage('kyc')" class="admin-nav-btn w-full flex items-center gap-3 px-4 py-3 rounded-xl text-gray-300 hover:bg-dark-700 hover:text-white transition text-sm" data-page="kyc">
        <i class="fas fa-id-card w-5 text-center"></i> KYC
        <span id="admin-kyc-badge" class="hidden ml-auto bg-purple-500 text-white text-xs rounded-full px-2 py-0.5">0</span>
      </button>
      <button onclick="showAdminPage('commissions')" class="admin-nav-btn w-full flex items-center gap-3 px-4 py-3 rounded-xl text-gray-300 hover:bg-dark-700 hover:text-white transition text-sm" data-page="commissions">
        <i class="fas fa-dollar-sign w-5 text-center"></i> Commissions
      </button>
      <button onclick="showAdminPage('wallets')" class="admin-nav-btn w-full flex items-center gap-3 px-4 py-3 rounded-xl text-gray-300 hover:bg-dark-700 hover:text-white transition text-sm" data-page="wallets">
        <i class="fas fa-wallet w-5 text-center"></i> Wallets
      </button>
      <button onclick="showAdminPage('bv')" class="admin-nav-btn w-full flex items-center gap-3 px-4 py-3 rounded-xl text-gray-300 hover:bg-dark-700 hover:text-white transition text-sm" data-page="bv">
        <i class="fas fa-chart-bar w-5 text-center"></i> Volumes BV
      </button>
      <button onclick="showAdminPage('licenses')" class="admin-nav-btn w-full flex items-center gap-3 px-4 py-3 rounded-xl text-gray-300 hover:bg-dark-700 hover:text-white transition text-sm" data-page="licenses">
        <i class="fas fa-file-contract w-5 text-center"></i> Licences
      </button>
      <button onclick="showAdminPage('config')" class="admin-nav-btn w-full flex items-center gap-3 px-4 py-3 rounded-xl text-gray-300 hover:bg-dark-700 hover:text-white transition text-sm" data-page="config">
        <i class="fas fa-gear w-5 text-center"></i> Config MLM
      </button>
      <button onclick="showAdminPage('packages')" class="admin-nav-btn w-full flex items-center gap-3 px-4 py-3 rounded-xl text-gray-300 hover:bg-dark-700 hover:text-white transition text-sm" data-page="packages">
        <i class="fas fa-box-open w-5 text-center"></i> Packages
      </button>
      <button onclick="showAdminPage('payment-gateway')" class="admin-nav-btn w-full flex items-center gap-3 px-4 py-3 rounded-xl text-gray-300 hover:bg-dark-700 hover:text-white transition text-sm" data-page="payment-gateway">
        <i class="fas fa-credit-card w-5 text-center"></i> Paiement
      </button>
      <button onclick="showAdminPage('reports')" class="admin-nav-btn w-full flex items-center gap-3 px-4 py-3 rounded-xl text-gray-300 hover:bg-dark-700 hover:text-white transition text-sm" data-page="reports">
        <i class="fas fa-file-chart-column w-5 text-center"></i> Rapports
      </button>
      <button onclick="showAdminPage('marketing')" class="admin-nav-btn w-full flex items-center gap-3 px-4 py-3 rounded-xl text-gray-300 hover:bg-dark-700 hover:text-white transition text-sm" data-page="marketing">
        <i class="fas fa-bullhorn w-5 text-center"></i> Assets Marketing
      </button>
      <button onclick="showAdminPage('admins')" class="admin-nav-btn w-full flex items-center gap-3 px-4 py-3 rounded-xl text-gray-300 hover:bg-dark-700 hover:text-white transition text-sm" data-page="admins">
        <i class="fas fa-user-shield w-5 text-center"></i> Administrateurs
      </button>
    </nav>
    <div class="p-4 border-t border-dark-600">
      <button onclick="doAdminLogout()" class="w-full flex items-center gap-3 px-4 py-2.5 rounded-xl text-gray-400 hover:text-red-400 hover:bg-red-900/20 transition text-sm">
        <i class="fas fa-sign-out-alt w-5 text-center"></i> Déconnexion
      </button>
    </div>
  </aside>

  <!-- ADMIN CONTENT -->
  <main class="flex-1 overflow-y-auto bg-dark-900">
    <header class="bg-dark-800 border-b border-dark-600 px-6 py-4 flex items-center justify-between sticky top-0 z-10">
      <h1 id="admin-page-title" class="text-lg font-semibold">Dashboard</h1>
      <div id="admin-header-info" class="text-sm text-gray-400"></div>
    </header>
    <div id="admin-page-content" class="p-6"></div>
  </main>
</div>

<!-- TOAST -->
<div id="toast" class="fixed bottom-4 right-4 z-50 hidden">
  <div id="toast-inner" class="px-6 py-3 rounded-xl shadow-lg text-sm font-medium"></div>
</div>

<script>
// ============================================================
// LEADER — Application Admin v2.0
// Plan de compensation CDC v6.0 — Complet
// ============================================================

const API = ''
let adminToken = localStorage.getItem('leader_admin_token')
let currentAdmin = null

// ── UTILS ──────────────────────────────────────────────────
function apiAdmin(method, path, data) {
  return axios({ method, url: `${API}/api/admin${path}`, data,
    headers: adminToken ? { Authorization: `Bearer ${adminToken}` } : {} })
    .then(r => r.data).catch(e => { throw e.response?.data || { error: e.message } })
}
function apiAuth(method, path, data) {
  return axios({ method, url: `${API}/api/auth${path}`, data })
    .then(r => r.data).catch(e => { throw e.response?.data || { error: e.message } })
}

function fmt$(n) { return '$' + Number(n||0).toLocaleString('en-US', { minimumFractionDigits: 2, maximumFractionDigits: 2 }) }
function fmtBV(n) { return Number(n||0).toLocaleString('en-US', { maximumFractionDigits: 0 }) + ' BV' }
function fmtDate(d) { if (!d) return '—'; return new Date(d).toLocaleDateString('fr-FR', { day:'2-digit', month:'short', year:'numeric' }) }
function fmtDatetime(d) { if (!d) return '—'; return new Date(d).toLocaleString('fr-FR', { day:'2-digit', month:'short', year:'numeric', hour:'2-digit', minute:'2-digit' }) }
function fmtPct(n) { return Number(n||0).toFixed(1) + '%' }

function showToast(msg, type='success') {
  // Toast fixe, survive aux rechargements de #page-content
  let t = document.getElementById('toast-floating')
  if (!t) {
    t = document.createElement('div')
    t.id = 'toast-floating'
    t.style.cssText = 'position:fixed;bottom:24px;right:24px;z-index:9999;transition:opacity 0.4s;pointer-events:none;'
    document.body.appendChild(t)
  }
  t.innerHTML = `<div class="px-6 py-3 rounded-xl shadow-2xl text-sm font-semibold flex items-center gap-3 ${
    type==='success'
      ? 'bg-green-600 text-white border border-green-400/40'
      : 'bg-red-600 text-white border border-red-400/40'
  }"><i class="fas ${
    type==='success' ? 'fa-check-circle' : 'fa-exclamation-triangle'
  }"></i>${msg}</div>`
  t.style.opacity = '1'
  clearTimeout(t._hideTimer)
  t._hideTimer = setTimeout(() => { t.style.opacity = '0' }, 3500)
}

// Retour visuel sur bouton pendant la sauvegarde
function btnSaving(btn) {
  if (!btn || btn.tagName !== 'BUTTON') return () => {}
  const orig = btn.innerHTML
  const origClass = btn.className
  btn.disabled = true
  btn.innerHTML = '<i class="fas fa-spinner fa-spin mr-2"></i>Sauvegarde...'
  return () => { btn.disabled = false; btn.innerHTML = orig; btn.className = origClass }
}
function btnSaved(btn) {
  if (!btn || btn.tagName !== 'BUTTON') return
  btn.innerHTML = '<i class="fas fa-check mr-2"></i>Sauvegardé !'
  btn.classList.remove('bg-gold-500','hover:bg-gold-400','bg-green-600','hover:bg-green-500','bg-blue-600','hover:bg-blue-500','bg-purple-600','hover:bg-purple-500')

async function doAdminLogin() {
  const email = document.getElementById('admin-email').value.trim()
  const password = document.getElementById('admin-password').value
  const errEl = document.getElementById('admin-login-error')
  errEl.style.display = 'none'
  try {
    const data = await apiAuth('POST', '/admin/login', { email, password })
    adminToken = data.token
    localStorage.setItem('leader_admin_token', data.token)
    currentAdmin = data.admin
    initAdminApp()
  } catch (e) {
    errEl.textContent = e.error || 'Identifiants incorrects'
    errEl.style.display = 'block'
  }
}
document.addEventListener('keydown', e => {
  if (e.key === 'Enter' && document.getElementById('admin-auth-screen').style.display !== 'none') doAdminLogin()
})
function doAdminLogout() {
  localStorage.removeItem('leader_admin_token')
  adminToken = null; currentAdmin = null
  window.location.replace('/admin/login')
}
async function initAdminApp() {
  if (!adminToken) { window.location.replace('/admin/login'); return }
  // Afficher immédiatement le backoffice sans attendre le dashboard
  const authScreen = document.getElementById('admin-auth-screen')
  const adminApp = document.getElementById('admin-app')
  if (authScreen) authScreen.style.display = 'none'
  if (adminApp) adminApp.style.display = 'flex'

  loadAdminBadges().catch(() => {})
}
async function loadAdminBadges() {
  try {

    </button>

async function placeMember(memberId, forcePlace = false) {
  const parentInput = document.getElementById('place-parent').value.trim()
  const position = document.querySelector('input[name="place-pos"]:checked')?.value
  if (!parentInput || !position) { showToast('Remplissez tous les champs', 'error'); return }
  try {
    const members = await apiAdmin('GET', `/members?search=${encodeURIComponent(parentInput)}&per_page=1`)
    const parent = members.members?.[0]
    if (!parent) { showToast('Parent introuvable', 'error'); return }
    // forcePlace = true quand le parrain est ROOT (bypass du verrou délai)
    const r = await apiAdmin('POST', '/holding-tank/place', { member_id: memberId, parent_id: parent.id, position, force_place: forcePlace })
    closeModal()
    showToast(` Placé en position ${position} sous ${parent.first_name} ${parent.last_name} — Rang: ${r.newRank||'none'}`)
    await showAdminPage('holding-tank')
    loadAdminBadges()
  } catch (e) { showToast(e.error||'Erreur', 'error') }
}

// ── ARBRE BINAIRE ADMIN — SVG + CLASSIQUE ──────────────────
const ADM_NW = 158, ADM_NH = 118, ADM_HGAP = 40, ADM_VGAP = 90
const ADM_CLASSIC_DEPTH = 4   // niveaux affichés en mode classique

// ── État global admin ──────────────────────────────────────
let _admFullTree    = null   // arbre complet chargé une fois (depth=8)
let _admClassicRoot = null   // racine du chargement (point de départ de recherche)
let _admFocus       = null   // nœud affiché comme racine actuellement
let _admNavStack    = []     // pile pour Remonter

// ── Utilitaires ────────────────────────────────────────────
function adminTreeMaxDepth(node) {
  if (!node) return 0
  return 1 + Math.max(adminTreeMaxDepth(node.left), adminTreeMaxDepth(node.right))
}

function admFindNodeById(node, id) {
  if (!node) return null
  if (node.id === id) return node
  return admFindNodeById(node.left, id) || admFindNodeById(node.right, id)
}

// ── Toggle mode admin ──────────────────────────────────────
function getAdmTreeMode()     { return localStorage.getItem('adm_tree_mode') || 'classic' }
function setAdmTreeMode(mode) { localStorage.setItem('adm_tree_mode', mode) }

function toggleAdmTreeMode() {
  const next = getAdmTreeMode() === 'classic' ? 'svg' : 'classic'
  setAdmTreeMode(next)
  _admRenderWithMode(next)
  _admUpdateToggleBtn(next)
}

function _admUpdateToggleBtn(mode) {
  const btn = document.getElementById('adm-tree-toggle-btn')
  if (!btn) return
  if (mode === 'classic') {
    btn.innerHTML = '<i class="fas fa-diagram-project mr-1.5"></i>Vue SVG'
    btn.title = 'Passer en vue SVG (pan/zoom)'
  } else {
    btn.innerHTML = '<i class="fas fa-sitemap mr-1.5"></i>Vue Classique'
    btn.title = 'Passer en vue classique (navigation par clic)'
  }
}

function _admRenderWithMode(mode) {
  if (!_admFullTree) return
  if (mode === 'classic') {
    if (!_admFocus) { _admFocus = _admClassicRoot; _admNavStack = [] }
    renderAdmClassicInner()
  } else {
    const wrap = document.getElementById('adm-tree-wrap')
    if (!wrap) return
    const svgContent = renderAdminTreeSVG(_admFullTree)
    wrap.innerHTML = admPanZoomWrapper(svgContent)
    admInitPanZoom()
  }
}

// ── Navigation classique admin ─────────────────────────────
function admClassicNavigateTo(nodeId) {
  const target = admFindNodeById(_admFullTree, nodeId)
  if (!target) return
  _admNavStack.push(_admFocus)
  _admFocus = target
  renderAdmClassicInner()
}

function admClassicGoBack() {
  if (_admNavStack.length === 0) return
  _admFocus = _admNavStack.pop()
  renderAdmClassicInner()
}

function admClassicGoHome() {
  _admNavStack = []
  _admFocus = _admClassicRoot
  renderAdmClassicInner()
}

// ── Rendu nœud classique admin ─────────────────────────────
function renderAdmClassicNode(node, depth, isFocusRoot=false) {
  if (!node) return ''

  const isHolding  = node.in_holding_tank
  const rankColors = { captain:'border-yellow-500/60', commander:'border-purple-500/60',
    admiral:'border-blue-400/60', vice_admiral:'border-green-400/60',
    ambassador:'border-orange-500/60', diamond:'border-sky-400/60',
    triple_diamond:'border-fuchsia-500/60', crown:'border-red-500/60' }
  const rankC = rankColors[node.current_rank] || 'border-dark-500'

  const avatarColors = { captain:'text-yellow-400', commander:'text-purple-400',
    admiral:'text-blue-400', vice_admiral:'text-green-400', ambassador:'text-orange-400',
    diamond:'text-sky-400', triple_diamond:'text-fuchsia-400', crown:'text-red-400' }
  const avatarC = avatarColors[node.current_rank] || 'text-gold-400'

  const bvL = Number(node.left_bv_monthly||0).toLocaleString('fr-FR')
  const bvR = Number(node.right_bv_monthly||0).toLocaleString('fr-FR')

  const holdingBadge = isHolding
    ? `<div class="text-[9px] text-orange-400 mt-0.5"><i class="fas fa-clock mr-0.5"></i>Holding</div>` : ''

  const cardClass = `tree-node-card ${rankC}
    ${isFocusRoot ? 'ring-2 ring-gold-500/40 bg-dark-700 scale-105 shadow-lg shadow-black/40 cursor-default'
                  : 'cursor-pointer hover:border-gold-500/60 hover:bg-dark-700 transition-all'}
    ${isHolding ? 'border-orange-500/60 bg-orange-500/5' : ''}`

  const cardInner = `
    <div class="w-9 h-9 rounded-full bg-dark-900 flex items-center justify-center mx-auto mb-1 text-xs font-bold ${avatarC}
                ${isFocusRoot ? 'ring-2 ring-gold-500/40' : ''}">
      ${(node.first_name||'?')[0]}${(node.last_name||'?')[0]}
    </div>
    <div class="text-[10px] font-bold text-gold-400 font-mono">${node.unique_id}</div>
    <div class="text-xs font-semibold text-white truncate mt-0.5">${node.first_name} ${node.last_name}</div>
    <div class="mt-1">${rankBadge(node.current_rank)}</div>
    ${holdingBadge}
    <div class="mt-1 flex justify-between text-[9px]">
      <span class="text-blue-400">G:${bvL}</span>
      <span class="text-green-400">D:${bvR}</span>
    </div>
    ${isFocusRoot
      ? '<div class="text-[9px] text-gold-500/70 mt-1 font-medium">● Vue actuelle</div>'
      : '<div class="text-[9px] text-gray-600 mt-0.5"><i class="fas fa-hand-pointer mr-0.5"></i>Descendre</div>'}
  `

  // Nœud focus = pas cliquable pour naviguer ; sinon double action : naviguer OU ouvrir fiche
  // On met 2 boutons : clic carte → descendre, petit bouton → fiche membre
  const card = isFocusRoot
    ? `<div class="${cardClass}" title="${node.unique_id}">${cardInner}</div>`
    : `<div class="${cardClass}" onclick="admClassicNavigateTo('${node.id}')" title="Descendre depuis ${node.first_name}">
        ${cardInner}
        <button onclick="event.stopPropagation();viewMember('${node.id}')"
          class="mt-1.5 w-full text-[9px] bg-dark-600 hover:bg-gold-500/20 hover:text-gold-400 text-gray-500
                 rounded-lg py-0.5 transition border border-dark-500 hover:border-gold-500/40">
          <i class="fas fa-user mr-0.5"></i>Voir fiche
        </button>
      </div>`

  // Feuille max profondeur
  if (depth >= ADM_CLASSIC_DEPTH - 1) return `<div class="tree-node">${card}</div>`

  // Slot vide
  const emptySlot = (position) => {
    const posColor = position === 'L' ? 'blue' : 'green'
    const posLabel = position === 'L' ? 'Gauche' : 'Droite'
    return `<div class="tree-node">
      <div class="tree-node-card empty border-dashed border-${posColor}-500/20 cursor-default">
        <div class="w-8 h-8 rounded-full border-2 border-dashed border-${posColor}-800
                    flex items-center justify-center mx-auto mb-2">
          <i class="fas fa-circle-dot text-${posColor}-900 text-xs"></i>
        </div>
        <div class="text-${posColor}-900 text-[10px] font-medium">Slot libre</div>
        <div class="text-gray-700 text-[9px] mt-0.5">${posLabel}</div>
      </div>
    </div>`
  }

  const leftChild  = node.left  ? renderAdmClassicNode(node.left,  depth+1) : emptySlot('L')
  const rightChild = node.right ? renderAdmClassicNode(node.right, depth+1) : emptySlot('R')

  return `
  <div class="tree-node">
    ${card}
    <div class="tree-connector"></div>
    <div class="tree-children">
      <div class="flex flex-col items-center">
        <div class="text-[10px] text-blue-400 mb-1 font-medium">Gauche</div>
        ${leftChild}

// ── Reingold-Tilford pour l'admin ──────────────────────────
function admSvgAssignPos(node, depth, offsetX) {
  if (!node) return ADM_NW + ADM_HGAP
  const lW = node.left  ? admSvgAssignPos(node.left,  depth+1, offsetX)       : ADM_NW + ADM_HGAP
  const rW = node.right ? admSvgAssignPos(node.right, depth+1, offsetX + lW)  : ADM_NW + ADM_HGAP
  const tW = lW + rW
  node._x = offsetX + lW - (ADM_NW + ADM_HGAP) / 2
  node._y = depth * (ADM_NH + ADM_VGAP)
  if (node.left)  admSvgAssignPos(node.left,  depth+1, offsetX)
  if (node.right) admSvgAssignPos(node.right, depth+1, offsetX + lW)
  return tW
}

// ── Bézier admin ───────────────────────────────────────────
function admBezier(x1, y1, x2, y2) {
  const my = (y1 + y2) / 2
  return `M${x1},${y1} C${x1},${my} ${x2},${my} ${x2},${y2}`
}

// ── Collecte éléments SVG admin ────────────────────────────
// Slots vides = affichage informatif (pas d'action)
// Noeuds = cliquables → viewMember()
function admCollect(node, depth, maxDepth, paths, rects, slots, parentX, parentY, position) {
  if (!node) {
    if (parentX !== null && position !== null) {
      const sx = parentX - ADM_NW / 2
      const sy = parentY + ADM_NH + ADM_VGAP / 2
      paths.push(`<path d="${admBezier(parentX, parentY + ADM_NH, parentX, sy)}" stroke="#1F2937" stroke-width="1.5" fill="none" stroke-dasharray="5,4"/>`)
      const posLabel = position === 'L' ? 'Gauche' : 'Droite'
      const posColor = position === 'L' ? '#3B82F6' : '#10B981'
      slots.push(`
        <g style="cursor:default">
          <rect x="${sx}" y="${sy}" width="${ADM_NW}" height="${ADM_NH}" rx="12"
                fill="#111827" stroke="${posColor}33" stroke-width="1.5" stroke-dasharray="6,4"/>
          <text x="${sx+ADM_NW/2}" y="${sy+38}" text-anchor="middle" fill="${posColor}55" font-size="22" font-family="sans-serif">○</text>
          <text x="${sx+ADM_NW/2}" y="${sy+62}" text-anchor="middle" fill="${posColor}66" font-size="10" font-family="sans-serif">Slot libre</text>
          <text x="${sx+ADM_NW/2}" y="${sy+76}" text-anchor="middle" fill="${posColor}44" font-size="8.5" font-family="sans-serif">${posLabel}</text>
        </g>`)
    }
    return
  }

  const cx = node._x + ADM_NW / 2
  const cy = node._y

  if (parentX !== null) {
    paths.push(`<path d="${admBezier(parentX, parentY + ADM_NH, cx, cy)}" stroke="#374151" stroke-width="1.5" fill="none"/>`)
  }

  if (position !== null) {
    const lcolor = position === 'L' ? '#60A5FA' : '#34D399'
    rects.push(`<text x="${cx}" y="${cy-16}" text-anchor="middle" fill="${lcolor}" font-size="9" font-weight="700" font-family="sans-serif">${position==='L'?'GAUCHE':'DROITE'}</text>`)
  }

  // Couleurs rang
  const isHolding = node.in_holding_tank
  const rankColors = { captain:'#F59E0B', commander:'#A78BFA', admiral:'#60A5FA', vice_admiral:'#34D399', ambassador:'#F97316', diamond:'#38BDF8', triple_diamond:'#E879F9', crown:'#EF4444' }
  const borderColor = isHolding ? '#FB923C' : (rankColors[node.current_rank] || '#374151')
  const bgFill      = isHolding ? '#431407' : '#1F2937'
  const initials    = `${(node.first_name||'?')[0]}${(node.last_name||'?')[0]}`.toUpperCase()
  const rankShort   = { captain:'Capt.', commander:'Cmdr.', admiral:'Adm.', vice_admiral:'V-Adm.', ambassador:'Ambas.', diamond:'Diam.', triple_diamond:'3xDiam.', crown:'Crown', membre:'Mbr.' }
  const rankLbl     = rankShort[node.current_rank] || (node.current_rank||'Mbr.')
  const rankC       = rankColors[node.current_rank] || '#9CA3AF'
  const bvL         = Number(node.left_bv_monthly||0).toLocaleString('fr-FR')
  const bvR         = Number(node.right_bv_monthly||0).toLocaleString('fr-FR')

  // Nœud cliquable → viewMember()
  const safeId = (node.id||'').replace(/'/g, '')
  rects.push(`
    <g class="adm-node" onclick="viewMember('${safeId}')" style="cursor:pointer">
      <rect x="${node._x}" y="${cy}" width="${ADM_NW}" height="${ADM_NH}" rx="12"
            fill="${bgFill}" stroke="${borderColor}" stroke-width="${isHolding?2.5:1.5}"
            class="adm-node-rect"/>
      <!-- Avatar -->
      <circle cx="${cx}" cy="${cy+30}" r="20" fill="#111827" stroke="${borderColor}" stroke-width="1.5"/>
      <text x="${cx}" y="${cy+36}" text-anchor="middle" fill="${rankC}" font-size="12" font-weight="700" font-family="sans-serif">${initials}</text>
      <!-- Unique ID -->
      <text x="${cx}" y="${cy+60}" text-anchor="middle" fill="#D97706" font-size="9" font-weight="700" font-family="monospace">${node.unique_id}</text>
      <!-- Nom -->
      <text x="${cx}" y="${cy+73}" text-anchor="middle" fill="#F9FAFB" font-size="10" font-weight="600" font-family="sans-serif">${(node.first_name+' '+node.last_name).substring(0,19)}</text>
      <!-- Badge rang -->
      <rect x="${cx-30}" y="${cy+79}" width="60" height="13" rx="6" fill="${rankC}22"/>
      <text x="${cx}" y="${cy+89}" text-anchor="middle" fill="${rankC}" font-size="8" font-weight="700" font-family="sans-serif">${rankLbl}</text>
      <!-- BV -->
      <text x="${node._x+6}" y="${cy+108}" fill="#60A5FA" font-size="8" font-family="sans-serif">G:${bvL}</text>
      <text x="${node._x+ADM_NW-6}" y="${cy+108}" text-anchor="end" fill="#34D399" font-size="8" font-family="sans-serif">D:${bvR}</text>
      ${isHolding ? `<text x="${cx}" y="${cy+9}" text-anchor="middle" fill="#FB923C" font-size="7.5" font-weight="700" font-family="sans-serif">⏳ HOLDING</text>` : ''}
    </g>`)

  if (depth < maxDepth) {
    admCollect(node.left,  depth+1, maxDepth, paths, rects, slots, cx, cy, 'L')
    admCollect(node.right, depth+1, maxDepth, paths, rects, slots, cx, cy, 'R')
  }
}

// ── Rendu SVG admin complet ─────────────────────────────────
function renderAdminTreeSVG(rootNode) {
  const maxDepth = Math.min(adminTreeMaxDepth(rootNode), 6)
  const totalW   = admSvgAssignPos(rootNode, 0, 0)
  const totalH   = (maxDepth + 1) * (ADM_NH + ADM_VGAP) + 60

  const paths = [], rects = [], slots = []
  admCollect(rootNode, 0, maxDepth, paths, rects, slots, null, null, null)

  const svgW = Math.max(totalW + ADM_HGAP, 500)
  const svgH = totalH

  return `<svg xmlns="http://www.w3.org/2000/svg" width="${svgW}" height="${svgH}" style="display:block;overflow:visible">
    <style>
      .adm-node-rect { transition: stroke 0.15s, filter 0.15s; }
      .adm-node:hover .adm-node-rect { stroke: #F59E0B !important; filter: drop-shadow(0 0 6px #F59E0B44); }
      .adm-node:hover text { fill: #FDE68A; }
    </style>
    <g transform="translate(${ADM_HGAP/2}, 28)">
      ${paths.join('\n')}
      ${slots.join('\n')}
      ${rects.join('\n')}
    </g>
  </svg>`
}

let _admPZ = { tx:0, ty:0, scale:1 }

function admInitPanZoom() {
  const vp = document.getElementById('adm-tree-vp')
  const cv = document.getElementById('adm-tree-canvas')
  if (!vp || !cv) return
  _admPZ = { tx:0, ty:0, scale:1 }

  function applyT() { cv.style.transform = `translate(${_admPZ.tx}px,${_admPZ.ty}px) scale(${_admPZ.scale})` }

  let drag=false, sx=0, sy=0
  vp.addEventListener('mousedown', e => {
    if (e.button!==0) return
    drag=true; sx=e.clientX-_admPZ.tx; sy=e.clientY-_admPZ.ty
    vp.style.cursor='grabbing'; e.preventDefault()
  })
  window.addEventListener('mousemove', e => { if(!drag)return; _admPZ.tx=e.clientX-sx; _admPZ.ty=e.clientY-sy; applyT() })
  window.addEventListener('mouseup', () => { drag=false; vp.style.cursor='grab' })

  let ltx=0,lty=0
  vp.addEventListener('touchstart', e => { if(e.touches.length===1){ltx=e.touches[0].clientX;lty=e.touches[0].clientY} },{passive:true})
  vp.addEventListener('touchmove', e => {
    if(e.touches.length===1){
      _admPZ.tx+=e.touches[0].clientX-ltx; _admPZ.ty+=e.touches[0].clientY-lty
      ltx=e.touches[0].clientX; lty=e.touches[0].clientY; applyT()
    }
  },{passive:true})

  vp.addEventListener('wheel', e => {
    e.preventDefault()
    const r=vp.getBoundingClientRect(), mx=e.clientX-r.left, my=e.clientY-r.top
    const delta=e.deltaY>0?0.88:1.14
    const ns=Math.min(3,Math.max(0.12,_admPZ.scale*delta))
    _admPZ.tx=mx-(mx-_admPZ.tx)*(ns/_admPZ.scale)
    _admPZ.ty=my-(my-_admPZ.ty)*(ns/_admPZ.scale)
    _admPZ.scale=ns; applyT()
  },{passive:false})
}

function admZoom(factor) {
  const cv=document.getElementById('adm-tree-canvas'); if(!cv)return
  const vp=document.getElementById('adm-tree-vp'); if(!vp)return
  const r=vp.getBoundingClientRect(), cx=r.width/2, cy=r.height/2
  const ns=Math.min(3,Math.max(0.12,_admPZ.scale*factor))
  _admPZ.tx=cx-(cx-_admPZ.tx)*(ns/_admPZ.scale)
  _admPZ.ty=cy-(cy-_admPZ.ty)*(ns/_admPZ.scale)
  _admPZ.scale=ns
  cv.style.transform=`translate(${_admPZ.tx}px,${_admPZ.ty}px) scale(${_admPZ.scale})`
}
function admReset() {
  _admPZ={tx:0,ty:0,scale:1}
  const cv=document.getElementById('adm-tree-canvas')
  if(cv) cv.style.transform='translate(0px,0px) scale(1)'
}

  if (!wrap) return

      const members = await apiAdmin('GET', `/members?search=${encodeURIComponent(search)}&per_page=1`)
      rootId = members.members?.[0]?.id || ''
      if (!rootId) {
        wrap.innerHTML = `<div class="bg-dark-800 rounded-2xl border border-dark-600 p-8 text-orange-400 text-center">

    // Chargement unique depth=8 — navigation JS pure ensuite

    if (!d.tree) {
      wrap.innerHTML = `<div class="bg-dark-800 rounded-2xl border border-dark-600 p-8 text-gray-400 text-center">

    // Stocker l'arbre + réinitialiser navigation
    _admFullTree    = d.tree
    _admClassicRoot = d.tree
    _admFocus       = d.tree
    _admNavStack    = []

    const maxD = adminTreeMaxDepth(d.tree)
    if (infoEl) infoEl.textContent = `${d.total || ''} membres · profondeur ${maxD} niveaux`

    _admRenderWithMode(getAdmTreeMode())

  } catch (e) {
    wrap.innerHTML = `<div class="bg-dark-800 rounded-2xl border border-red-500/30 p-6 text-red-400">
      <i class="fas fa-exclamation-triangle mr-2"></i>Erreur : ${e.error || e.message || 'inconnue'}

  }
}

async function doCreditWallet() {
  const memberSearch = document.getElementById('cr-member').value
  const memberId = document.getElementById('cr-member-id').value
  const amount = parseFloat(document.getElementById('cr-amount').value)
  const note = document.getElementById('cr-note').value
  const wallet_type = document.getElementById('cr-wallet-type').value
  if (!memberSearch || !amount || amount <= 0) { showToast('Remplissez tous les champs', 'error'); return }
  try {
    let mid = memberId
    if (!mid) {
      const res = await apiAdmin('GET', `/members?search=${encodeURIComponent(memberSearch)}&per_page=1`)
      const member = res.members?.[0]
      if (!member) { showToast('Membre introuvable', 'error'); return }
      mid = member.id
    }
    await apiAdmin('POST', '/wallets/credit', { member_id: mid, amount, note, wallet_type })
    closeModal()
    showToast(`${fmt$(amount)} crédités avec succès (${wallet_type})`)
    showAdminPage('wallets')
  } catch (e) { showToast(e.error||'Erreur', 'error') }
}

async function saveCompConfig(keys, btnEl) {
  // Collecter toutes les valeurs des inputs cfg-*
  const updates = {}
  // Si keys est une chaîne JSON (passée via data-attribute), la parser
  if (typeof keys === 'string') { try { keys = JSON.parse(keys) } catch { keys = [] } }
  // Si keys est vide → sauvegarder TOUS les cfg-* présents dans la page
  if (!keys || !keys.length) {
    document.querySelectorAll('[id^="cfg-"]').forEach(el => {
      const k = el.id.replace('cfg-', '')
      updates[k] = el.value
    })
  } else {
    keys.forEach(k => { const el = document.getElementById(`cfg-${k}`); if (el) updates[k] = el.value })
  }

  // Récupérer le bouton par ID si btnEl est une chaîne, sinon utiliser l'élément directement
  let btn = (typeof btnEl === 'string') ? document.getElementById(btnEl) : btnEl
  if (!btn || btn.tagName !== 'BUTTON') btn = null
  const restore = btnSaving(btn)

  try {
    await apiAdmin('PUT', '/config/compensation', updates)
    btnSaved(btn)
    showToast(' Paramètres compensation sauvegardés !')
    // Recharger la section config après 1.4s
    setTimeout(async () => {
      const el = document.getElementById('admin-page-content')
      if (el) await adminConfig(el)
    }, 1400)
  }
  catch (e) {
    restore()
    showToast(e.error || 'Erreur lors de la sauvegarde', 'error')
  }
}
async function saveBonusConfig(btnEl) {
  const keys = ['credit_croissance_enabled','reserve_strategique_enabled','rayonnement_enabled','influence_enabled','fast_start_enabled','recommendation_enabled']
  const updates = {}
  keys.forEach(k => {
    const el = document.getElementById(`bns-${k}`)
    if (el) updates[k] = el.checked ? 'true' : 'false'
  })
  const restore = btnSaving(btnEl)
  try {
    await apiAdmin('PUT', '/config/bonus', updates)
    btnSaved(btnEl)
    showToast(' Configuration bonus sauvegardée !')
  }
  catch (e) { restore(); showToast(e.error||'Erreur', 'error') }
}
async function saveRankConfig(name, btnEl) {
  const useTotal = document.getElementById(`rc-${name}-use-total`)?.checked ? 1 : 0
  const lbl = document.getElementById(`rc-${name}-use-total-lbl`)
  if (lbl) lbl.innerHTML = useTotal
    ? `Mode BV : <span class="text-gold-400 font-medium">Total à vie (rang définitif)</span>`
    : `Mode BV : <span class="text-blue-400 font-medium">Mensuel (recalcul chaque mois)</span>`
  const badgeUrl = document.getElementById(`rc-${name}-badge`)?.value || null
  const restore = btnSaving(btnEl)
  try {
    await apiAdmin('PUT', `/config/rank/${name}`, {
      min_bv_leg:        parseFloat(document.getElementById(`rc-${name}-bv`).value),
      min_directs:       parseInt(document.getElementById(`rc-${name}-dir`).value),
      monthly_prime:     parseFloat(document.getElementById(`rc-${name}-prime`).value),
      monthly_cap:       parseFloat(document.getElementById(`rc-${name}-cap`).value),
      bv_rank_use_total: useTotal,
      badge_url:         badgeUrl || undefined,
    })
    btnSaved(btnEl)
    showToast(` Rang ${name} sauvegardé`)
  } catch (e) { restore(); showToast(e.error||'Erreur', 'error') }
}

async function uploadRankBadge(rankName, inputEl) {
  const file = inputEl.files?.[0]
  if (!file) return
  const allowed = ['image/svg+xml','image/png','image/jpeg','image/webp','image/gif']
  if (!allowed.includes(file.type)) { showToast('Format non supporté — SVG, PNG, JPEG, WEBP', 'error'); inputEl.value=''; return }
  if (file.size > 512*1024) { showToast('Fichier trop lourd — max 500 Ko', 'error'); inputEl.value=''; return }
  const dataUrl = await new Promise((res, rej) => {
    const reader = new FileReader()
    reader.onload  = e => res(e.target.result)
    reader.onerror = () => rej(new Error('Lecture impossible'))
    reader.readAsDataURL(file)
  })
  // Mise à jour champ caché + preview immédiat
  const hidden  = document.getElementById(`rc-${rankName}-badge`)
  if (hidden) hidden.value = dataUrl
  const preview = document.getElementById(`badge-preview-${rankName}`)
  if (preview) {
    preview.innerHTML = `<img src="${dataUrl}" class="w-full h-full object-cover" style="border-radius:50%">`
    preview.classList.remove('border-dark-500')
    preview.classList.add('border-gold-500/60')
  }
  try {
    await apiAdmin('PUT', `/config/rank/${rankName}`, { badge_url: dataUrl })
    showToast(` Badge ${rankName} uploadé !`)
    // Afficher bouton supprimer si absent
    const btnZone = preview?.parentElement?.querySelector('.flex.gap-1')
    if (btnZone && !btnZone.querySelector('[data-del-badge]')) {
      const del = document.createElement('button')
      del.setAttribute('data-del-badge','1')
      del.onclick = () => deleteRankBadge(rankName, del)
      del.className = 'bg-red-900/30 hover:bg-red-900/60 text-red-400 text-[10px] px-2 py-1 rounded-lg border border-red-800/30 transition'
      del.title = 'Supprimer le badge'
      del.innerHTML = '<i class="fas fa-trash"></i>'
      btnZone.appendChild(del)
    }
  } catch (e) {

    if (preview) preview.innerHTML = `<i class="fas fa-image text-gray-600 text-xl"></i>`

async function deleteRankBadge(rankName, btnEl) {
  if (!confirm(`Supprimer le badge du rang "${rankName}" ?`)) return
  const orig = btnEl?.innerHTML
  if (btnEl) { btnEl.disabled=true; btnEl.innerHTML='<i class="fas fa-spinner fa-spin"></i>' }
  try {
    await apiAdmin('DELETE', `/config/rank/${rankName}/badge`)
    const hidden = document.getElementById(`rc-${rankName}-badge`)
    if (hidden) hidden.value = ''
    const preview = document.getElementById(`badge-preview-${rankName}`)
    if (preview) {
      preview.innerHTML = `<i class="fas fa-image text-gray-600 text-xl"></i>`
      preview.classList.remove('border-gold-500/60')
      preview.classList.add('border-dark-500')
    }
    if (btnEl) btnEl.remove()
    showToast(`️ Badge ${rankName} supprimé`)
  } catch (e) {
    if (btnEl) { btnEl.disabled=false; btnEl.innerHTML=orig }
    showToast(e.error||'Erreur suppression badge', 'error')
  }
}

          <div class="flex gap-2">

              <i class="fas fa-plus mr-1"></i>Ajouter un package

      ${categories.length > 0
        ? categories.map(renderCategorySection).join('')
        : `<div class="bg-dark-800 rounded-2xl border border-dark-600 p-12 text-center">
             <i class="fas fa-layer-group text-gray-600 text-4xl mb-4"></i>
             <p class="text-gray-400 font-medium">Aucune categorie configuree</p>

      ${noCatSection}

async function createPackage(categoryId) {
  const name  = document.getElementById('pkg-name').value.trim()
  const price = parseFloat(document.getElementById('pkg-price').value)
  const bv    = parseFloat(document.getElementById('pkg-bv').value)
  const desc  = document.getElementById('pkg-desc').value.trim()
  const rate  = parseFloat(document.getElementById('pkg-rate').value) || 5
  const order = parseInt(document.getElementById('pkg-order').value)   || 0
  const featuresRaw = document.getElementById('pkg-features').value
  const active = document.getElementById('pkg-active').checked

  if (!name || isNaN(price) || isNaN(bv)) { showToast('Nom, prix et BV sont obligatoires', 'error'); return }

  const features = featuresRaw.split('\n').map(l => l.trim()).filter(l => l.length > 0)

  try {
    await apiAdmin('POST', '/packages/enriched', {
      name, price_usd: price, bv_value: bv,
      description: desc || null,
      features: JSON.stringify(features),
      is_active: active,
      category_id: categoryId || null,
      direct_commission_rate: rate,
      display_order: order,
      type: 'Production',
      includes_license: 0
    })
    closeModal()
    showToast(`Package "${name}" cree`)
    showAdminPage('packages')
  } catch (e) { showToast(e.error||'Erreur lors de la creation', 'error') }
}

  const name  = document.getElementById('epkg-name').value.trim()

  const desc  = document.getElementById('epkg-desc').value.trim()

  const order = parseInt(document.getElementById('epkg-order').value)
  const featuresRaw = document.getElementById('epkg-features').value
  const active = document.getElementById('epkg-active').checked

  const features = featuresRaw.split('\n').map(l => l.trim()).filter(l => l.length > 0)

  try {
    await apiAdmin('PUT', `/packages/${id}/enriched`, {
      name: name || undefined,
      price_usd: isNaN(price) ? undefined : price,
      bv_value: isNaN(bv) ? undefined : bv,

function renderGwField(gwKey, field, values) {
  const val = (values && values[field.key]) || ''
  const inputId = `gw-${gwKey}-${field.key}`
  if (field.type === 'toggle') {
    const isActive = val === 'true' || val === '1'
    return `
    <div class="col-span-2 flex items-center justify-between bg-dark-700 rounded-xl px-4 py-3">
      <label class="text-sm text-gray-300">${field.label}</label>
      <label class="relative inline-flex items-center cursor-pointer">
        <input type="checkbox" id="${inputId}" class="sr-only peer" ${isActive ? 'checked' : ''}>
        <div class="w-11 h-6 bg-dark-600 rounded-full peer peer-checked:after:translate-x-full after:content-[''] after:absolute after:top-0.5 after:left-[2px] after:bg-white after:rounded-full after:h-5 after:w-5 after:transition-all peer-checked:bg-gold-500"></div>
      </label>
    </div>`
  }
  if (field.type === 'textarea') {
    return `
    <div class="col-span-2">
      <label class="form-label">${field.label}</label>
      <textarea id="${inputId}" class="form-input" rows="2" placeholder="${field.placeholder||''}">${val}</textarea>
    </div>`
  }
  return `
  <div>
    <label class="form-label">${field.label}</label>
    <input id="${inputId}" type="${field.type||'text'}" class="form-input${field.mono?' font-mono text-xs':''}" placeholder="${field.placeholder||''}" value="${val}">
  </div>`
}

async function adminPaymentGateway(el) {
  el.innerHTML = '<div class="flex justify-center py-16"><div class="loader"></div></div>'
  try {
    const d = await apiAdmin('GET', '/config/payment-gateway')
    const gateways = d.gateways || {}
    // gateways = { gateway_id: { key: value } }
    // gateway_id peut etre "bank", "bank_2", "paypal", "crypto_btc", etc.
    // type_group est stocke dans la cle "type_group" de chaque gateway

    // Regrouper les gateway_ids par type_group
    const byGroup = {}
    for (const [gwId, vals] of Object.entries(gateways)) {
      // Determiner le groupe : la cle type_group si presente, sinon le prefix du gwId
      const grp = vals.type_group || gwId.split('_')[0]
      if (!byGroup[grp]) byGroup[grp] = []
      byGroup[grp].push({ gwId, vals })
    }
    // Pour les groupes qui n'ont aucune entree, on cree un groupe vide
    for (const g of GW_GROUPS) {
      if (!byGroup[g.id]) byGroup[g.id] = []
    }

    const renderGroupSection = (group) => {
      const entries = byGroup[group.id] || []
      const colors  = GW_COLOR_MAP[group.color]

      const renderEntry = (gwId, vals, idx) => {
        const isActive = vals.active === 'true' || vals.active === '1'
        return `
        <div class="border border-dark-600 rounded-xl overflow-hidden mb-4" id="gw-entry-${gwId}">
          <div class="px-4 py-3 bg-dark-700 flex items-center justify-between">
            <div class="flex items-center gap-2">
              <span class="text-xs font-mono text-gray-500">${gwId}</span>
              <span class="text-xs px-2 py-0.5 rounded-full ${isActive ? 'bg-green-500/20 text-green-400' : 'bg-dark-600 text-gray-500'}">${isActive ? 'Actif' : 'Inactif'}</span>
              ${vals.label ? `<span class="text-sm font-medium text-white">${vals.label}</span>` : ''}
            </div>
            <div class="flex gap-2">
              <button onclick="saveGateway('${gwId}')" class="${colors.btn} text-white text-xs font-bold px-3 py-1.5 rounded-lg transition">
                <i class="fas fa-save mr-1"></i>Sauvegarder
              </button>
              <button onclick="deleteGateway('${gwId}')" class="bg-red-900/30 text-red-400 text-xs px-3 py-1.5 rounded-lg border border-red-500/30 hover:bg-red-900/50 transition">
                <i class="fas fa-trash mr-1"></i>Supprimer
              </button>
            </div>
          </div>
          <div class="p-4 grid grid-cols-1 md:grid-cols-2 gap-3">
            ${group.fields.map(f => renderGwField(gwId, f, vals)).join('')}
          </div>
        </div>`
      }

      return `
      <div class="bg-dark-800 rounded-2xl border border-dark-600 overflow-hidden">
        <div class="px-6 py-4 border-b border-dark-600 flex items-center justify-between">
          <div class="flex items-center gap-3">
            <div class="w-10 h-10 rounded-xl ${colors.bg} flex items-center justify-center">
              <i class="${group.icon} ${colors.text} text-lg"></i>
            </div>
            <div>
              <div class="font-semibold text-white">${group.label}</div>
              <div class="text-xs text-gray-500">${entries.length} entree(s) configuree(s)</div>
            </div>
          </div>
          <button onclick="addGatewayEntry('${group.id}')" class="text-xs ${colors.add} border px-3 py-1.5 rounded-lg hover:opacity-80 transition font-medium">
            <i class="fas fa-plus mr-1"></i>Ajouter
          </button>
        </div>
        <div class="p-4">
          ${entries.length > 0
            ? entries.map((e,i) => renderEntry(e.gwId, e.vals, i)).join('')
            : `<div class="text-center text-gray-500 text-sm py-6">
                Aucune entree. Cliquez sur "Ajouter" pour creer votre premiere methode ${group.label}.
               </div>`
          }
        </div>
      </div>`
    }

    el.innerHTML = `
    <div class="space-y-6">
      <div class="flex items-center justify-between flex-wrap gap-3">
        <p class="text-sm text-gray-400">Configurez les modes de paiement affiches aux membres. Chaque categorie peut avoir plusieurs entrees (ex: plusieurs comptes bancaires).</p>
        <button onclick="showAdminPage('packages')" class="text-gold-400 text-sm hover:underline">
          <i class="fas fa-arrow-left mr-2"></i>Retour aux packages
        </button>
      </div>
      <div class="bg-amber-900/20 border border-amber-500/30 rounded-xl p-3 text-xs text-amber-300">
        <i class="fas fa-exclamation-triangle mr-2"></i>
        Verifiez que les coordonnees sont correctes avant de sauvegarder. Les membres voient ces informations directement.
      </div>
      ${GW_GROUPS.map(renderGroupSection).join('')}
    </div>`

  } catch (e) { el.innerHTML = `<p class="text-red-400 p-4">Erreur: ${e.error||e.message}</p>` }
}

async function addGatewayEntry(groupId) {
  // Generer un gwId unique : groupId + _ + timestamp court
  const suffix = Date.now().toString(36)
  const gwId = groupId === 'bank' || groupId === 'paypal' || groupId === 'crypto' || groupId === 'card' || groupId === 'manual'
    ? (groupId === 'wallet' ? 'wallet' : `${groupId}_${suffix}`)
    : `${groupId}_${suffix}`
  // Initialiser l'entree avec type_group
  try {
    await apiAdmin('PUT', '/config/payment-gateway', { gateway: gwId, settings: { type_group: groupId, active: 'false', label: '' } })
    showToast('Nouvelle entree creee — remplissez les champs puis sauvegardez')
    showAdminPage('payment-gateway')
  } catch (e) { showToast(e.error||'Erreur', 'error') }
}

async function saveGateway(gateway) {
  const prefix = `gw-${gateway}-`
  const settings = {}
  document.querySelectorAll(`[id^="${prefix}"]`).forEach(input => {
    const key = input.id.replace(prefix, '')
    settings[key] = input.type === 'checkbox' ? (input.checked ? 'true' : 'false') : input.value
  })
  // Conserver type_group si present dans la config existante
  const existing = document.getElementById(`gw-entry-${gateway}`)
  if (!settings.type_group) settings.type_group = gateway.split('_')[0]
  try {
    await apiAdmin('PUT', '/config/payment-gateway', { gateway, settings })
    showToast(`"${gateway}" sauvegardee`)
    showAdminPage('payment-gateway')
  } catch (e) { showToast(e.error||'Erreur', 'error') }
}

async function deleteGateway(gateway) {
  if (!confirm(`Supprimer la methode de paiement "${gateway}" ? Cette action est irreversible.`)) return
  try {
    await apiAdmin('DELETE', '/config/payment-gateway/' + gateway)
    showToast(`"${gateway}" supprimee`)
    showAdminPage('payment-gateway')
  } catch (e) {
    // Si DELETE pas encore implemente, on desactive simplement
    await apiAdmin('PUT', '/config/payment-gateway', { gateway, settings: { active: 'false', deleted: 'true' } })
    showToast(`"${gateway}" desactivee`)
    showAdminPage('payment-gateway')
  }
}

    <div><label class="form-label">Email</label><input id="na-email" type="email" class="form-input" placeholder="admin@leadernetwork.com"></div>
    <div><label class="form-label">Mot de passe</label><input id="na-pwd" type="password" class="form-input" placeholder="Minimum 8 caractères"></div>
    <div><label class="form-label">Rôle</label>
      <select id="na-role" class="form-input">
        <option value="admin">Admin</option>
        <option value="super_admin">Super Admin</option>
      </select>
    </div>
    <div class="bg-red-900/20 border border-red-500/30 rounded-xl p-3 text-xs text-red-300">
      <i class="fas fa-exclamation-triangle mr-1"></i>Un Super Admin a accès à toutes les fonctionnalités sans restriction.
    </div>
    <button onclick="createAdmin()" class="w-full bg-red-700 text-white font-bold py-3 rounded-xl hover:bg-red-600 transition">Créer l'administrateur</button>
  </div>`)
}
async function createAdmin() {
  try {
    await apiAdmin('POST', '/admins', {
      name: document.getElementById('na-name').value,
      email: document.getElementById('na-email').value,
      password: document.getElementById('na-pwd').value,
      role: document.getElementById('na-role').value
    })
    closeModal(); showToast('Administrateur créé !'); showAdminPage('admins')
  } catch (e) { showToast(e.error||'Erreur', 'error') }
}

// ── INIT ───────────────────────────────────────────────────
// Compatible defer : si 'load' déjà passé, on exécute directement
function _adminInit() {
  if (adminToken) initAdminApp()
  else window.location.replace('/admin/login')
}
if (document.readyState === 'complete' || document.readyState === 'interactive') {
  // DOM et/ou page déjà prêts — exécuter immédiatement
  _adminInit()
} else {
  window.addEventListener('DOMContentLoaded', _adminInit)
}

</script>
</body>
</html>
